# =============================================================================
# 模板说明：本文件是原作者（AI/机器人方向博士，关注中国与欧洲）的扫描范围，不含身份信息，
# 但类别、点名单位、城市与公务员/专项区域都是按其画像写的。fork 后请逐类过一遍：
# 用不到的类别设 enabled = false，units/browse 换成你领域的单位，query_templates 中的字面量按需修改。
# Template note: this scan scope was written for the original author's field and region. After forking,
# disable categories you don't need (enabled = false), replace units/browse with your own institutions,
# and adjust the literal words in query_templates. See README.md.
# =============================================================================
# =============================================================================
# config/sources.toml —— 扫描类别、频率预算、点名单位、可抓取列表页
#
# 候选人个人信息不在这里（见 config/profile.toml）。这里只回答三个问题：
#   1. 扫什么（[[category]]：原 PROMPT 扫描范围 1–10 类各一条，第 8 类并入 [[source]]）
#   2. 多久扫一次、每次几组关键词（[schedule] + 每类 every/offset/season/queries_per_turn）
#   3. 哪些页面可以脚本直接抓（[[source]] fetch = "html_list"），哪些只能人工打开（browse/none）
#
# ---- 频率设计（目标：全周平均每天 ≤ 15 组检索，优先保证公务员与崖州湾） ----
#   day = (今天 − schedule.epoch).days；类别在 (day + offset) % every == 0 的日子轮到。
#   旺季 season.every 覆盖 every；当月不在 active_months 时降为每 7 天；周六日关键词数 × weekend_factor。
#
#   类别                 every/offset  每轮组数(模板+固定)  平均每天          理由
#   overseas_postdoc        2 / 0        3+0 = 3        1.5              海外博后发布节奏慢、截止期长，隔天即可
#   cn_postdoc              2 / 1        3+0 = 3        1.5              国内博后多为长期招收，隔天；与海外类错开
#   talent_program          3 / 2        2+0 = 2        0.7              人才计划多为年度/季度窗口，3 天一轮
#   soe_campus              2 / 1        3+0 = 3        1.5（校招季 3）  （weight 3）校招季 9–11 月改为每天（season），3–5、12 月隔天，其余月份每周
#   industry_soe            3 / 1        2+0 = 2        0.7              其他行业国企零散发布，3 天一轮；淡季每周
#   public_institution      2 / 1        2+0 = 2        1.0              事业单位公告零散但量大，隔天
#   national_lab            2 / 0        3+0 = 3        1.5              与求职目标最对口，隔天 + 点名单位滚动
#   civil_service           7 / 0        2+2 = 4        旺季 4（周末 3） 公务员：10–3 月旺季每天（season.every = 1），淡季每周 1 次；两条固定检索不计 queries_per_turn、不被裁剪
#   special_zone_yazhouwan  2 / 0        3+2 = 5        2.5（常被裁到 3） 专项关注，每 2 天一轮（原为每天，按预算折中）；两条固定检索同上
#   ------------------------------------------------------------------------------------
#   「每轮组数」= 模板展开数（queries_per_turn）+ 固定检索数（pinned）。pinned 不计入 queries_per_turn，
#   但计入每天总数与 max_queries_per_day 的裁剪比较；裁剪只砍模板组，pinned 永不被砍。
#   旺季（11 月）实测：偶数日 ≈ 3+3+3+4+5（+2，industry_soe 或 talent_program 轮到时）= 18–20 → 裁到 15；
#   奇数日 ≈ 3+3+2+4+2（talent_program 与 industry_soe 交替轮到）= 14；周六日模板组数减半。
#   超过 max_queries_per_day 时 plan_tool 按 weight 从低到高逐个砍 1 组（每类至少 1 组）。
#   `python3 tools/plan_tool.py schedule --days 14` 可打印两周日历核对。
#
# ---- 字段速查 ----
#   lang            关键词语言键；profile 的 terms 缺该语言时回退 en，再回退任一
#   requires_roles  与 profile.target.roles 无交集 → 该类别自动关闭（关掉某类：删 roles 或 enabled = false）
#   query_templates 槽位只允许 {topic} {domain} {role} {city} {province} {country} {unit} {zone}
#                   {year} {year_next} {cohort} {degree}；{cohort} 在 cohort_system = none 时整条跳过
#   pinned          每轮必查的固定检索词；units 点名单位（{unit} 槽位按窗口滚动点名）
#   browse          Routine 直接打开核对的页面（脚本抓不了的门户/人事处/课题组页）
#   extra_instructions / level_hint   该类特殊规则与分级提示，brief 原样呈现
# =============================================================================

schema = 1

[schedule]
# 轮换基准日（算 day 用），设在过去即可；不要随意改动，否则各类错开日会整体平移（改动量取 42 的倍数可保持相位）
epoch = 2025-12-09
# 每天检索组数软上限 / brief 中写给 Routine 的「合计不少于」
max_queries_per_day = 15
min_queries_per_day = 8
# 周六日每类关键词数乘以此系数（向上取整，至少 1）
weekend_factor = 0.5
# fetch_tool：单源超时、整轮上限（秒）、每源最多候选数
fetch_timeout_sec = 20
fetch_total_sec = 120
fetch_max_items_per_source = 40

# ============================================================== 1. 海外博后/研究岗
[[category]]
id = "overseas_postdoc"
name = "海外博后/研究岗"
lang = "en"
requires_roles = ["postdoc"]
enabled = true
every = 2
offset = 0
queries_per_turn = 3
lookback_days = 3
weight = 3
query_templates = [
  "{topic} postdoc {country}",
  "{domain} postdoctoral researcher {year}",
  "{unit} postdoc {domain}",
  "{role} {topic} {country} university",
  "site:academicpositions.com {topic} postdoc",
]
