[[source]]
id = "jobsacuk_robotics"
category = "overseas_postdoc"
name = "jobs.ac.uk 机器人 / 计算机视觉搜索"
url = "https://www.jobs.ac.uk/search/?keywords=robotics&sortOrder=1"
pages = ["https://www.jobs.ac.uk/search/?keywords=computer+vision&sortOrder=1"]
every = 1
fetch = "html_list"
link_pattern = "/job/[A-Z0-9]+/"
block_pattern = "j-search-result__result"
date_pattern = "(?:Closes|Expires)\\W+(\\d{1,2} [A-Za-z]{3})"
date_format = "%d %b"
date_kind = "deadline"
time_attr = false
closed_markers = ["Closing today", "Expired"]
title_filter = "profile"
# 标题排除词（正则，忽略大小写）：讲师/教授编制岗、PhD 奖学金、经理/技术员/行政岗不进候选；注意不要误伤 Post-doctoral
title_exclude = "\\b(Lecturer|Professor|Faculty Position|Tutor|Reader|Dean|Head of|Manager|Technician|Administrator|Apprentice|Studentship|PhD|DPhil|Teaching)\\b|(?<!Post-)(?<!Post)Doctoral"
status = "stable"
notes = "每条结果一个 div.j-search-result__result，锚点 href 形如 /job/DTN496/slug，截止写成「Closes 15 Nov」（无年份 → 就近未来日期，标 inferred）；另有「Date Placed: 04 Nov」为发布日"

