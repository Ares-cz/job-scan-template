status = "stable"
notes = "全部 ~120 条在一页，每条 li.job-ad__item__wrapper，锚文本含标题 + 工作量/地点 + 「03.11.2026 | 系所」（发布日）；页面默认德语但岗位标题多为英文；RobotX Postdoctoral Fellowship 每年 10–11 月在此开放"

