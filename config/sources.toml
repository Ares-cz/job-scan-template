units = [
  "ETH Zurich", "University of Zurich", "TU Munich", "University of Bonn PhenoRob", "Lamarr Institute",
  "TU Delft", "TU Eindhoven", "Wageningen University", "University of Twente",
  "University of Hong Kong", "Nanyang Technological University", "National University of Singapore",
  "Imperial College London", "University of Oxford", "EPFL", "KU Leuven", "INRIA",
]
browse = [
  "https://www.nature.com/naturecareers/jobs/",
  "https://www.academics.com/jobs",
  "https://careers.tudelft.nl/",
  "https://careers.epfl.ch/",
  "https://www.epfl.ch/labs/lis/open-positions",
  "https://careers.nus.edu.sg/",
  "https://rpl.uni-bonn.de/opportunities/",
  "https://www.ais.uni-bonn.de/jobs.html",
  "https://arclab.hku.hk/OpenPositions.html",
  "https://airlab.hku.hk/open-position",
  "https://jobs.zalf.de/",
]
level_hint = "院校 QS 排名上限见 brief「分级口径」（profile.target.overseas_qs_max，未设置则不限）；要求「在候选人博士授位国以外毕业 / 具有该国以外博后经历」的项目（按 profile [[education]] 的 country 判断）只作降级参考"
extra_instructions = "关键词用英文；国家按 profile.locations.countries 的 tier 轮换；可脚本抓取的 jobs.ac.uk / EURAXESS / jobs.ethz.ch 结果见 out/fetched.md，AcademicTransfer 需直接打开搜索页核对；AcademicPositions 不可直接访问，用 site: 检索词代替"

